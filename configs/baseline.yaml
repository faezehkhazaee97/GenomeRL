project_name: GenomeRL
seed: 42

dataset:
  train_path: data/processed/gue_promoter/train.jsonl
  valid_path: data/processed/gue_promoter/valid.jsonl
  test_path: data/processed/gue_promoter/test.jsonl

model:
  backbone_name: zhihan1996/DNABERT-2-117M
  freeze_backbone: true
  hidden_size: 768
  num_labels: 2
  fallback_name: simple_dna_cnn

tokenizer:
  name: dnabert2_bpe
  max_length: 512

training:
  batch_size: 16
  learning_rate: 0.00003
  epochs: 5
  weight_decay: 0.01
  warmup_steps: 100
  device: cuda

evaluation:
  output_dir: results/baselines/dnabert2_bpe
  metrics:
    - accuracy
    - macro_f1
    - compression_ratio
