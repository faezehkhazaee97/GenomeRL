project_name: GenomeRLFineTunedBaseline_human_tf_1_long
seed: 42

dataset:
  train_path: data/processed/gue_human_tf_1/train.jsonl
  valid_path: data/processed/gue_human_tf_1/valid.jsonl
  test_path:  data/processed/gue_human_tf_1/test.jsonl

model:
  backbone_name: zhihan1996/DNABERT-2-117M
  freeze_backbone: false
  hidden_size: 768
  num_labels: 2

tokenizer:
  name: dnabert2_bpe
  max_length: 512

training:
  batch_size: 16
  learning_rate: 3.0e-05
  epochs: 20
  weight_decay: 0.01
  warmup_steps: 200
  device: cuda

evaluation:
  output_dir: results/baselines/dnabert2_bpe_finetuned_human_tf_1_long
