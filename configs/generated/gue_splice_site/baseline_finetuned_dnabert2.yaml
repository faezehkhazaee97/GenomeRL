project_name: GenomeRLFineTunedBaseline_splice_site
seed: 42
dataset:
  train_path: data/processed/gue_splice_site/train.jsonl
  valid_path: data/processed/gue_splice_site/valid.jsonl
  test_path: data/processed/gue_splice_site/test.jsonl
model:
  backbone_name: zhihan1996/DNABERT-2-117M
  freeze_backbone: false
  hidden_size: 768
  num_labels: 3
tokenizer:
  name: dnabert2_bpe
  max_length: 512
training:
  batch_size: 16
  learning_rate: 3.0e-05
  epochs: 5
  weight_decay: 0.01
  warmup_steps: 100
  device: cuda
evaluation:
  output_dir: results/baselines/dnabert2_bpe_finetuned_splice_site
