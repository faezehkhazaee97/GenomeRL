agent:
  dropout: 0.1
  hidden_dim: 128
  initial_boundary_prob: 0.2
  input_dim: 768
  model_dim: 256
  num_layers: 1
dataset:
  test_path: data/processed/gue_splice_site/test.jsonl
  train_path: data/processed/gue_splice_site/train.jsonl
  valid_path: data/processed/gue_splice_site/valid.jsonl
env:
  backbone_name: zhihan1996/DNABERT-2-117M
  checkpoint_path: results/baselines/dnabert2_bpe/best_model.pt
  cls_mix_weight: 0.0
  freeze_embeddings: true
  hidden_size: 768
  max_length: 512
  num_labels: 3
  trainable_encoder_layers: 2
  # Segment PE specific
  use_segment_pe: true
  segment_pe_dim: 128
  max_segments: 100
evaluation:
  threshold: 0.5
project_name: GenomeRLSegmentPE
rl:
  below_min_penalty: 5.0
  beta: 0.02
  env_learning_rate: 1.0e-05
  group_size: 8
  min_segment_ratio: 0.08
  policy_learning_rate: 3.0e-05
seed: 42
training:
  batch_size: 8
  log_interval: 10
  max_steps: 500
  num_workers: 0
  output_dir: results/rl_runs/grpo_finetuned_env_segment_pe_splice_site
